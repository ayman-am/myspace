name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Deploy without git metadata
        run: |
          # Vercel blocks deployments whose commit author is not a team member.
          # Removing .git makes the CLI deploy as a plain upload instead.
          echo "commit author was: $(git log -1 --format='%ae')"
          rm -rf .git

      - name: Upload deployment to Vercel (no wait)
        run: |
          npx --yes vercel@latest deploy \
            --prod --yes --no-wait --archive=tgz --json \
            --project myspace --create-if-missing \
            --token "$VERCEL_TOKEN" \
            --build-env VITE_SUPABASE_URL="$SUPABASE_URL" \
            --build-env VITE_SUPABASE_ANON_KEY="$SUPABASE_KEY" \
            > deploy.json
          node -e "const d=require('./deploy.json'); console.log('id=' + d.id); console.log('url=' + (d.url||''))"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Wait for READY state
        run: |
          set -e
          DEPLOY_ID=$(node -pe "require('./deploy.json').id")
          echo "Deployment: $DEPLOY_ID"
          for i in $(seq 1 90); do
            BODY=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$DEPLOY_ID?withGitRepoInfo=true" || true)
            STATE=$(echo "$BODY" | node -pe "try{JSON.parse(require('fs').readFileSync(0,'utf8')).readyState||''}catch(e){''}" 2>/dev/null || echo "")
            echo "state=$STATE"
            if [ "$STATE" = "READY" ]; then
              URL=$(echo "$BODY" | node -pe "try{'https://'+JSON.parse(require('fs').readFileSync(0,'utf8')).url}catch(e){''}" 2>/dev/null)
              echo "### ✅ تم النشر" >> $GITHUB_STEP_SUMMARY
              echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
              echo "Deployment URL: $URL"
              exit 0
            fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              echo "❌ deployment failed: $STATE"
              echo "$BODY" | head -c 2000
              exit 1
            fi
            sleep 5
          done
          echo "❌ timed out waiting for deployment"
          exit 1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
